right_format = "$time"

[gcloud]
detect_env_vars = ["CLOUDSDK_ACTIVE_CONFIG_NAME"]

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"

[git_metrics]
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# Show only venv, hide python version
[python]
symbol = ""
format = '[(\($virtualenv\) )]($style)'

